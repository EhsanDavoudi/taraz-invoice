name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    - name: Run Tests
      run: |
        dotnet test TarazInvoice.Tests/TarazInvoice.Tests.csproj -c Release

    - name: Publish .NET win-x64
      run: |
        dotnet publish TarazInvoice.csproj -c Release -r win-x64 --self-contained true -o publish/app

    - name: Build Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Create Release and Upload Setup Asset
      uses: softprops/action-gh-release@v2
      with:
        files: publish/TarazInvoice_Setup_*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
