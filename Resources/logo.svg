<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Cobalt Shine Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Tray Gradient -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#090D16" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="url(#beamGrad)" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#2563EB" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="256" cy="220" r="90" fill="#10B981" opacity="0.18" filter="url(#softGlow)"/>

  <!-- ================= LOGO EMBLEM: TARAZ (تـراز) ================= -->
  
  <!-- Central Base Stand -->
  <path d="M190 392 L322 392 C328 392 334 397 334 403 L334 410 C334 414 330 418 326 418 L186 418 C182 418 178 414 178 410 L178 403 C178 397 184 392 190 392 Z" 
        fill="#94A3B8" opacity="0.9"/>
  <path d="M216 384 L296 384 L308 392 L204 392 Z" fill="#CBD5E1"/>

  <!-- Central Vertical Pillar -->
  <path d="M246 148 L266 148 L266 384 L246 384 Z" fill="#E2E8F0" filter="url(#dropShadow)"/>
  <path d="M256 148 L266 148 L266 384 L256 384 Z" fill="#CBD5E1"/>

  <!-- Central Pivot Diamond / Crown -->
  <polygon points="256,122 272,148 256,162 240,148" fill="url(#emeraldGrad)"/>

  <!-- Main Balance Beam (تراز) with aerodynamic curve -->
  <path d="M110 178 Q 256 142 402 178 C 408 179 414 174 412 168 C 410 162 404 159 398 157 Q 256 124 114 157 C 108 159 102 162 100 168 C 98 174 104 179 110 178 Z" 
        fill="url(#beamGrad)" filter="url(#dropShadow)"/>

  <!-- Left Scale: Suspension Strings & Dish -->
  <line x1="126" y1="174" x2="88" y2="280" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="126" y1="174" x2="164" y2="280" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M78 280 C 78 322 174 322 174 280 Z" fill="url(#trayGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="126" cy="280" rx="48" ry="8" fill="#60A5FA"/>

  <!-- Right Scale: Suspension Strings & Dish -->
  <line x1="386" y1="174" x2="348" y2="280" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="386" y1="174" x2="424" y2="280" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M338 280 C 338 322 434 322 434 280 Z" fill="url(#trayGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="386" cy="280" rx="48" ry="8" fill="#60A5FA"/>

  <!-- Dynamic Ascending Growth Surge / Arrow traversing the center -->
  <path d="M164 348 L228 274 L276 312 L344 218 L320 214 L368 186 L364 238 L348 234 L280 330 L232 292 L164 366 Z" 
        fill="url(#emeraldGrad)" filter="url(#softGlow)"/>
  
  <!-- Sleek Accent Dots on Dishes representing balanced coins/items -->
  <circle cx="126" cy="272" r="7" fill="#FDE047"/>
  <circle cx="386" cy="272" r="7" fill="#FDE047"/>
  
</svg>
